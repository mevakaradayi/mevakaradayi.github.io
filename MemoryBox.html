<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>My Memory Box</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Griffy&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 10px;
      background: radial-gradient(circle at top, #1a1630 0%, #05050a 60%, #020208 100%);
      font-family: 'Griffy', cursive;;
      color: #fdf6e3;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .memory-photos {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 10px;
      padding: 60px 20px 20px;
      width: 100%;
      max-width: 1200px;
    }

    .memory-photo {
      position: relative;
      opacity: 0;
      border-radius: 8px;
      object-fit: cover;
      aspect-ratio: 1;
      width: calc((100% - 90px) / 10);
      cursor: pointer;
      transition: opacity 0.4s ease;
    }

    /* Home button */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.25s ease, transform 0.25s ease;
      z-index: 20;
      text-decoration: none;
      font-family: 'Griffy', cursive;
    }

    #homeButton:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .photo-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  /* visible state */
  .photo-modal-backdrop.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* Modal card */
  .photo-modal {
    background: rgba(0, 0, 0, 0.92);
    border-radius: 24px;
    padding: 22px 24px 18px;
    max-width: min(80vw, 600px);
    max-height: 80vh;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;          /* keep it neat, scroll only inside images area */
  }
  .photo-modal-images {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
    max-height: 60vh;          /* limit height */
    overflow-y: auto;          /* <-- THIS enables scrolling */
    margin-top: 4px;
    padding-right: 4px;        /* small padding so scrollbar doesn't hug images */
  }

  .photo-modal-images img {
    max-width: min(48%, 260px);  /* two per row on big screens */
    max-height: 40vh;
    border-radius: 16px;
    display: block;
  }


  /* Close button inside modal */
  .photo-modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    border: none;
    background: transparent;
    color: #fdf6e3;
    font-size: 20px;
    cursor: pointer;
  }

  /* Big version of image */
  .photo-modal img {
    max-width: 100%;
    max-height: 60vh;
    border-radius: 16px;
    display: block;
  }

  /* Caption text (from alt) */
  #photoModalCaption {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.9;
    text-align: center;
  }

  /* Tablets: 6 photos per row */
  @media (max-width: 900px) and (min-width: 701px) {
    .memory-photo {
      width: calc((100% - 40px) / 6);
    }
  }

  /* Larger phones: 5 photos per row */
  @media (max-width: 700px) and (min-width: 551px) {
    .memory-photo {
      width: calc((100% - 32px) / 5);
    }
  }

  /* Medium phones: 4 photos per row */
  @media (max-width: 550px) and (min-width: 401px) {
    .memory-photo {
      width: calc((100% - 24px) / 4);
    }

    #homeButton {
      padding: 10px 14px;
      font-size: 15px;
      top: 12px;
      left: 12px;
      min-width: 44px;
      min-height: 44px;
    }
  }

  /* Small phones: 3 photos per row */
  @media (max-width: 400px) {
    .memory-photo {
      width: calc((100% - 16px) / 3);
    }

    #homeButton {
      padding: 12px 16px;
      font-size: 16px;
      top: 10px;
      left: 10px;
      min-width: 44px;
      min-height: 44px;
    }

    .memory-photos {
      gap: 6px;
      padding: 10px;
    }
  }

  /* Modal adjustments for all non-desktop */
  @media (max-width: 900px) {
    .photo-modal {
      padding: 16px;
      max-width: 92vw;
      border-radius: 16px;
    }

    .photo-modal-images {
      gap: 8px;
    }

    .photo-modal-images img {
      max-width: 100%;
    }

    .photo-modal-close {
      font-size: 24px;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
    }

    #photoModalCaption {
      font-size: 12px;
    }
  }
  </style>
</head>

<!-- Clicked Photo Modal -->
 <div id="photoModal" class="photo-modal-backdrop">
  <div class="photo-modal">
    <button id="photoModalClose" class="photo-modal-close">✕</button>

    <!-- container for one or more images -->
    <div id="photoModalImages" class="photo-modal-images"></div>

    <p id="photoModalCaption"></p>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const photos = Array.from(document.querySelectorAll(".memory-photo"));
    const groups = {};

    photos.forEach((photo) => {
      const groupId = photo.dataset.group;
      if (groupId) {
        if (!groups[groupId]) {
          groups[groupId] = [];
        }
        groups[groupId].push(photo);
      }
    });

    const modal = document.getElementById("photoModal");
    const modalImagesContainer = document.getElementById("photoModalImages");
    const modalCap = document.getElementById("photoModalCaption");
    const modalClose = document.getElementById("photoModalClose");

    photos.forEach(function (photo) {
      photo.addEventListener("click", function () {
        const groupId = photo.dataset.group;
        let clickedSet;

        if (groupId && groups[groupId]) {
          clickedSet = groups[groupId];
        } else {
          clickedSet = [photo];
        }

        modalImagesContainer.innerHTML = "";

        const captions = [];
        clickedSet.forEach((p) => {
          const big = document.createElement("img");
          big.src = p.getAttribute("src");
          const alt = p.getAttribute("alt") || "";
          big.alt = alt;
          if (alt) captions.push(alt);
          modalImagesContainer.appendChild(big);
        });

        modalCap.textContent = captions.join(" · ");
        modal.classList.add("visible");
      });
    });

    function closePhotoModal() {
      modal.classList.remove("visible");
    }

    modalClose.addEventListener("click", closePhotoModal);

    modal.addEventListener("click", function (e) {
      if (e.target === modal) {
        closePhotoModal();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closePhotoModal();
      }
    });

    photos.forEach(function (photo, index) {
      const delay = index * 50;

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          photo.style.transition = "opacity 0.4s ease " + delay + "ms";
          photo.style.opacity = 1;
        });
      });
    });
  });
</script>
