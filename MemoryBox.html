<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Memory Box</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Griffy&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1630 0%, #05050a 60%, #020208 100%);
      font-family: 'Griffy', cursive;;
      color: #fdf6e3;
      overflow: hidden;
    }

    .memory-box-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      padding: 40px 60px;
      border-radius: 24px;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .memory-box-wrapper::before {
      content: "";
      position: absolute;
      inset: -60px;
      background: radial-gradient(circle, rgba(255, 215, 160, 0.9) 0%, rgba(255, 215, 160, 0) 55%);
      opacity: 0;
      filter: blur(28px);
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: -1;
    }

    .memory-box-wrapper:hover::before,
    .memory-box-wrapper.open::before {
      opacity: 1;
      transform: scale(1);
    }

    .memory-box-image {
      width: 300px;
      max-width: 70vw;
      display: block;
      margin: 0 auto 18px;
      transition: transform 0.25s ease;
    }

    .memory-box-wrapper:hover .memory-box-image {
      transform: scale(1.05);
    }

    .memory-title {
      font-size: 24px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .memory-subtitle {
      font-size: 14px;
      opacity: 0.8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .memory-subtitle.hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .memory-photos {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .memory-photo {
      position: absolute;
      width: 130px;
      max-width: 30vw;
      border-radius: 14px;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.45),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
    }

    @media (min-width: 900px) {
      .memory-photo { width: 160px; }
    }

    /* Close button */
    #closeButton {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.25s ease, transform 0.25s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }

    #closeButton.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #closeButton:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="memory-box-wrapper" id="memoryBox">
    <img src="Images/box-close.png" alt="Closed Memory Box" class="memory-box-image" id="memoryBoxImage">
    <div class="memory-title">My Memory Box</div>
    <div class="memory-subtitle" id="clickText">Click to Open</div>
  </div>

  <div class="memory-photos" id="memoryPhotos">
    <img src="Images/Photo1.png" alt="" class="memory-photo">
    <img src="Images/Photo2.png" alt="" class="memory-photo">
    <img src="Images/Photo3.png" alt="" class="memory-photo">
  </div>

  <!-- Close Box Button -->
  <button id="closeButton">✕ Close Box</button>

  <script>
  const boxWrapper = document.getElementById("memoryBox");
  const boxImage   = document.getElementById("memoryBoxImage");
  const clickText  = document.getElementById("clickText");
  const photos     = document.querySelectorAll(".memory-photo");
  const closeBtn   = document.getElementById("closeButton");

  let isOpen = false;

  boxWrapper.addEventListener("click", () => {
    if (isOpen) return;
    isOpen = true;
    boxWrapper.classList.add("open");
    boxImage.src = "Images/box-open.png";
    clickText.classList.add("hidden");
    closeBtn.classList.add("visible");
    scatterPhotos();
  });

  // closeBox fonksiyonunu BURADA kullanıyoruz
  closeBtn.addEventListener("click", closeBox);

  function scatterPhotos() {
    const rect   = boxWrapper.getBoundingClientRect();
    const startX = rect.left + rect.width / 2;
    const startY = rect.top  + rect.height / 2;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const edgeMargin = 120;

    const center = {
      left:   rect.left  - 160,
      right:  rect.right + 160,
      top:    rect.top   - 220,
      bottom: rect.bottom + 220
    };

    const zones = [];

    // ÜST BANT
    if (edgeMargin < center.top) {
      zones.push({
        xMin: edgeMargin,
        xMax: vw - edgeMargin,
        yMin: edgeMargin,
        yMax: center.top
      });
    }

    // ALT BANT
    if (center.bottom < vh - edgeMargin) {
      zones.push({
        xMin: edgeMargin,
        xMax: vw - edgeMargin,
        yMin: center.bottom,
        yMax: vh - edgeMargin
      });
    }

    // SOL BANT
    if (edgeMargin < center.left) {
      zones.push({
        xMin: edgeMargin,
        xMax: center.left,
        yMin: Math.max(edgeMargin, center.top),
        yMax: Math.min(vh - edgeMargin, center.bottom)
      });
    }

    // SAĞ BANT
    if (center.right < vw - edgeMargin) {
      zones.push({
        xMin: center.right,
        xMax: vw - edgeMargin,
        yMin: Math.max(edgeMargin, center.top),
        yMax: Math.min(vh - edgeMargin, center.bottom)
      });
    }

    if (zones.length === 0) {
      zones.push({
        xMin: edgeMargin,
        xMax: vw - edgeMargin,
        yMin: edgeMargin,
        yMax: vh - edgeMargin
      });
    }

    photos.forEach((photo, index) => {
      const zone = zones[Math.floor(Math.random() * zones.length)];

      const targetX = randomBetween(zone.xMin, zone.xMax);
      const targetY = randomBetween(zone.yMin, zone.yMax);
      const rotation = randomBetween(-25, 25);
      const delay = index * 90;

      photo.style.left = startX + "px";
      photo.style.top  = startY + "px";
      photo.style.transition = "none";
      photo.style.opacity = 0;
      photo.style.transform = "translate(-50%, -50%) scale(0.2)";

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          photo.style.transition = `
            left 0.9s ease-out ${delay}ms,
            top 0.9s ease-out ${delay}ms,
            transform 0.9s ease-out ${delay}ms,
            opacity 0.9s ease-out ${delay}ms
          `;
          photo.style.left = targetX + "px";
          photo.style.top  = targetY + "px";
          photo.style.opacity = 1;
          photo.style.transform =
            `translate(-50%, -50%) scale(1) rotate(${rotation}deg)`;
        });
      });
    });
  }

  // ✨ NEW: kutuyu kapatan fonksiyon
  function closeBox() {
    // butonu gizle
    closeBtn.classList.remove("visible");

    // fotoğrafları fade-out yap
    photos.forEach((photo) => {
      photo.style.transition = "opacity 0.4s ease";
      photo.style.opacity = 0;
    });

    // biraz bekleyip kutuyu eski haline getir
    setTimeout(() => {
      isOpen = false;
      boxWrapper.classList.remove("open");
      boxImage.src = "Images/box-close.png"; // başlangıçtakiyle aynı dosya adı
      clickText.classList.remove("hidden");
    }, 500);
  }

  function randomBetween(min, max) {
    return Math.random() * (max - min) + min;
  }
</script>

</body>
</html>
