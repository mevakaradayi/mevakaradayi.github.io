<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>My Memory Box</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Griffy&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1630 0%, #05050a 60%, #020208 100%);
      font-family: 'Griffy', cursive;;
      color: #fdf6e3;
      overflow: hidden;
    }

    .memory-box-wrapper {
      position: relative;
      text-align: center;
      cursor: pointer;
      padding: 0px 60px;
      border-radius: 24px;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .memory-box-wrapper::before {
      content: "";
      position: absolute;
      inset: -5px;
      background: radial-gradient(circle, rgba(255, 215, 160, 0.9) 0%, rgba(255, 215, 160, 0) 55%);
      opacity: 0;
      filter: blur(28px);
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: -1;
    }

    .memory-box-wrapper:hover::before,
    .memory-box-wrapper.open::before {
      opacity: 1;
      transform: scale(1);
    }

    .memory-box-image {
      width: 400px;
      max-width: 70vw;
      display: block;
      margin: 0 auto 10px;
      transition: transform 0.25s ease;
    }

    .memory-box-wrapper:hover .memory-box-image {
      transform: scale(1.05);
    }

    .memory-title {
      font-size: 24px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .memory-subtitle {
      font-size: 14px;
      opacity: 0.8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .memory-subtitle.hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .memory-photos {
      position: fixed;
      inset: 0;
      pointer-events: none;   /* container never blocks anything */
      z-index: 5;
    }

    .memory-photo {
      position: absolute;
      /* …your existing styles… */
      opacity: 0;  
      pointer-events: none;   /* default */
    }

    /* when box is open (.active), only the images accept clicks */
    .memory-photos.active .memory-photo {
      opacity: 1; 
      pointer-events: auto;
    }
    /* when the box is open, let clicks pass through it */
    .memory-box-wrapper.open {
      pointer-events: none;
    }

    @media (min-width: 900px) {
      .memory-photo { width: 160px; }
    }

    /* Home button */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.25s ease, transform 0.25s ease;
      z-index: 20;
      text-decoration: none;
      font-family: 'Griffy', cursive;
    }

    #homeButton:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    /* Close button */
    #closeButton {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.25s ease, transform 0.25s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      font-family: 'Griffy', cursive;
    }

    #closeButton.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #closeButton:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }
    .photo-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  /* visible state */
  .photo-modal-backdrop.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* Modal card */
  .photo-modal {
    background: rgba(0, 0, 0, 0.92);
    border-radius: 24px;
    padding: 22px 24px 18px;
    max-width: min(80vw, 600px);
    max-height: 80vh;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;          /* keep it neat, scroll only inside images area */
  }
  .photo-modal-images {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
    max-height: 60vh;          /* limit height */
    overflow-y: auto;          /* <-- THIS enables scrolling */
    margin-top: 4px;
    padding-right: 4px;        /* small padding so scrollbar doesn't hug images */
  }

  .photo-modal-images img {
    max-width: min(48%, 260px);  /* two per row on big screens */
    max-height: 40vh;
    border-radius: 16px;
    display: block;
  }


  /* Close button inside modal */
  .photo-modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    border: none;
    background: transparent;
    color: #fdf6e3;
    font-size: 20px;
    cursor: pointer;
  }

  /* Big version of image */
  .photo-modal img {
    max-width: 100%;
    max-height: 60vh;
    border-radius: 16px;
    display: block;
  }

  /* Caption text (from alt) */
  #photoModalCaption {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.9;
    text-align: center;
  }

  /* ===== NON-DESKTOP: GRID LAYOUT ===== */
  @media (max-width: 900px) {
    body {
      overflow-x: hidden;
      overflow-y: auto;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 10px;
      min-height: 100vh;
      height: auto;
    }

    /* Memory box wrapper adjustments for grid mode */
    .memory-box-wrapper {
      flex-shrink: 0;
    }

    .memory-box-wrapper.open {
      position: relative;
      margin-bottom: 20px;
    }

    /* Grid layout for photos on non-desktop */
    .memory-photos.grid-mode {
      position: relative;
      inset: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 8px;
      padding: 15px;
      width: 100%;
      max-width: 100vw;
      margin-top: 10px;
    }

    .memory-photos.grid-mode .memory-photo {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      transform: none !important;
      opacity: 0;
      transition: opacity 0.4s ease;
      border-radius: 8px;
      object-fit: cover;
      aspect-ratio: 1;
    }

    .memory-photos.grid-mode.active .memory-photo {
      opacity: 1;
    }
  }

  /* Tablets: 6 photos per row */
  @media (max-width: 900px) and (min-width: 701px) {
    .memory-photos.grid-mode .memory-photo {
      width: calc((100% - 40px) / 6);  /* 6 per row with gaps */
    }

    .memory-box-wrapper {
      padding: 0 30px;
    }

    .memory-box-image {
      width: 320px;
      max-width: 70vw;
    }
  }

  /* Larger phones: 5 photos per row */
  @media (max-width: 700px) and (min-width: 551px) {
    .memory-photos.grid-mode .memory-photo {
      width: calc((100% - 32px) / 5);  /* 5 per row with gaps */
    }

    .memory-box-wrapper {
      padding: 0 25px;
    }

    .memory-box-image {
      width: 280px;
      max-width: 75vw;
    }

    .memory-title {
      font-size: 20px;
    }
    .memory-subtitle {
      font-size: 13px;
    }
  }

  /* Medium phones: 4 photos per row */
  @media (max-width: 550px) and (min-width: 401px) {
    .memory-photos.grid-mode .memory-photo {
      width: calc((100% - 24px) / 4);  /* 4 per row with gaps */
    }

    .memory-box-wrapper {
      padding: 0 20px;
    }

    .memory-box-image {
      width: 250px;
      max-width: 80vw;
    }

    .memory-title {
      font-size: 18px;
    }
    .memory-subtitle {
      font-size: 12px;
    }

    #closeButton {
      padding: 10px 14px;
      font-size: 15px;
      top: 12px;
      right: 12px;
      min-width: 44px;
      min-height: 44px;
    }

    #homeButton {
      padding: 10px 14px;
      font-size: 15px;
      top: 12px;
      left: 12px;
      min-width: 44px;
      min-height: 44px;
    }
  }

  /* Small phones: 3 photos per row */
  @media (max-width: 400px) {
    .memory-photos.grid-mode .memory-photo {
      width: calc((100% - 16px) / 3);  /* 3 per row with gaps */
    }

    .memory-box-wrapper {
      padding: 0 15px;
    }

    .memory-box-image {
      width: 200px;
      max-width: 85vw;
    }

    .memory-title {
      font-size: 16px;
    }

    .memory-subtitle {
      font-size: 11px;
    }

    #closeButton {
      padding: 12px 16px;
      font-size: 16px;
      top: 10px;
      right: 10px;
      min-width: 44px;
      min-height: 44px;
    }

    #homeButton {
      padding: 12px 16px;
      font-size: 16px;
      top: 10px;
      left: 10px;
      min-width: 44px;
      min-height: 44px;
    }

    .memory-photos.grid-mode {
      gap: 6px;
      padding: 10px;
    }
  }

  /* Modal adjustments for all non-desktop */
  @media (max-width: 900px) {
    .photo-modal {
      padding: 16px;
      max-width: 92vw;
      border-radius: 16px;
    }

    .photo-modal-images {
      gap: 8px;
    }

    .photo-modal-images img {
      max-width: 100%;
    }

    .photo-modal-close {
      font-size: 24px;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
    }

    #photoModalCaption {
      font-size: 12px;
    }
  }
  </style>
</head>

<!-- Clicked Photo Modal -->
 <div id="photoModal" class="photo-modal-backdrop">

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const boxWrapper = document.getElementById("memoryBox");
    const boxImage   = document.getElementById("memoryBoxImage");
    const clickText  = document.getElementById("clickText");
    const photos     = Array.from(document.querySelectorAll(".memory-photo"));
    const groups = {};
    const photoUnits = [];  // each unit = { photos: [img, img, ...] }

    photos.forEach((photo) => {
      const groupId = photo.dataset.group;
      if (groupId) {
        if (!groups[groupId]) {
          groups[groupId] = [];
        }
        groups[groupId].push(photo);
      } else {
        // single, ungrouped photo
        photoUnits.push({ photos: [photo] });
      }
    });

    // add grouped sets as units too
    Object.values(groups).forEach((arr) => {
      photoUnits.push({ photos: arr });
    });
    const closeBtn   = document.getElementById("closeButton");
    const photosContainer = document.getElementById("memoryPhotos");

    const modal      = document.getElementById("photoModal");
    const modalImagesContainer = document.getElementById("photoModalImages");
    const modalCap   = document.getElementById("photoModalCaption");
    const modalClose = document.getElementById("photoModalClose");


    // state
    let isOpen = false;

    // ---- PHOTO MODAL ----
   photos.forEach(function (photo) {
    photo.addEventListener("click", function () {
      if (!isOpen) return; // only when box is open

      // determine which photos are in the same group as the clicked one
      const groupId = photo.dataset.group;
      let clickedSet;

      if (groupId && groups[groupId]) {
        clickedSet = groups[groupId];      // all photos with same data-group
      } else {
        clickedSet = [photo];              // just this one
      }

      // clear old images
      modalImagesContainer.innerHTML = "";

      // add all photos in the set to the modal
      const captions = [];
      clickedSet.forEach((p) => {
        const big = document.createElement("img");
        big.src = p.getAttribute("src");
        const alt = p.getAttribute("alt") || "";
        big.alt = alt;
        if (alt) captions.push(alt);
        modalImagesContainer.appendChild(big);
      });

      // caption is combined alts, if you want
      modalCap.textContent = captions.join(" · ");

      modal.classList.add("visible");
    });
  });



    function closePhotoModal() {
      modal.classList.remove("visible");
    }

    modalClose.addEventListener("click", closePhotoModal);

    modal.addEventListener("click", function (e) {
      if (e.target === modal) {
        closePhotoModal();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closePhotoModal();
      }
    });

    // Check if we're on a non-desktop device
    function isNonDesktop() {
      return window.innerWidth <= 900;
    }

    // ---- BOX OPEN ----
    boxWrapper.addEventListener("click", function () {
      if (isOpen) return;

      console.log("Box clicked"); // debug: you should see this in console

      isOpen = true;
      boxWrapper.classList.add("open");
      boxImage.src = "Images/box-open.png";
      clickText.classList.add("hidden");
      closeBtn.classList.add("visible");
      photosContainer.classList.add("active");

      if (isNonDesktop()) {
        // Grid mode for mobile/tablet
        photosContainer.classList.add("grid-mode");
        showPhotosInOrder();
      } else {
        // Scatter mode for desktop
        photosContainer.classList.remove("grid-mode");
        scatterPhotos();
      }
    });

    // ---- BOX CLOSE ----
    closeBtn.addEventListener("click", closeBox);

    function closeBox() {
      closeBtn.classList.remove("visible");

      photos.forEach(function (photo) {
        photo.style.transition = "opacity 0.4s ease";
        photo.style.opacity = 0;
      });

      setTimeout(function () {
        isOpen = false;
        boxWrapper.classList.remove("open");
        boxImage.src = "Images/box-close.png";
        clickText.classList.remove("hidden");
        photosContainer.classList.remove("active");
        photosContainer.classList.remove("grid-mode");
        
        // Reset photo styles for next open
        photos.forEach(function (photo) {
          photo.style.left = "";
          photo.style.top = "";
          photo.style.transform = "";
        });
      }, 500);
    }

    // ---- SHOW PHOTOS IN ORDER (Grid mode for mobile/tablet) ----
    function showPhotosInOrder() {
      photos.forEach(function (photo, index) {
        // Reset any scatter positioning
        photo.style.left = "";
        photo.style.top = "";
        photo.style.transition = "none";
        photo.style.opacity = 0;
        photo.style.transform = "";

        // Stagger the appearance
        const delay = index * 50;

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            photo.style.transition = "opacity 0.4s ease " + delay + "ms";
            photo.style.opacity = 1;
          });
        });
      });
    }

    // ---- SCATTER PHOTOS ----
    function scatterPhotos() {
      const rect = boxWrapper.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Mobile-responsive scatter parameters
      const isMobile = vw < 600;
      const margin = isMobile ? 30 : 80;
      const minR = Math.max(rect.width, rect.height) * (isMobile ? 0.5 : 0.9);
      const maxR = Math.min(vw, vh) * (isMobile ? 0.42 : 0.7);

      photoUnits.forEach(function (unit, unitIndex) {
        const baseT = unitIndex / photoUnits.length;
        const jitter = (Math.random() - 0.5) * (1 / photoUnits.length);
        const t = baseT + jitter;
        const angle = t * Math.PI * 2;

        const radius = randomBetween(minR, maxR);

        let targetX = centerX + radius * Math.cos(angle);
        let targetY = centerY + radius * Math.sin(angle);

        targetX = Math.min(vw - margin, Math.max(margin, targetX));
        targetY = Math.min(vh - margin, Math.max(margin, targetY));

        const baseRotation = randomBetween(-25, 25);
        const delay = unitIndex * 90;

        // spread photos within the same unit slightly around the shared center
        const spread = 30; // px

        unit.photos.forEach(function (photo, idx) {
          const offsetAngle = (idx - (unit.photos.length - 1) / 2) * 0.25;
          const offsetX = Math.cos(offsetAngle) * spread * idx;
          const offsetY = Math.sin(offsetAngle) * spread * idx;

          // start at box center
          photo.style.left = centerX + "px";
          photo.style.top  = centerY + "px";
          photo.style.transition = "none";
          photo.style.opacity = 0;
          photo.style.transform = "translate(-50%, -50%) scale(0.2)";

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              photo.style.transition =
                "left 0.9s ease-out " + delay + "ms, " +
                "top 0.9s ease-out " + delay + "ms, " +
                "transform 0.9s ease-out " + delay + "ms, " +
                "opacity 0.9s ease-out " + delay + "ms";

              photo.style.left = (targetX + offsetX) + "px";
              photo.style.top  = (targetY + offsetY) + "px";
              photo.style.opacity = 1;
              photo.style.transform =
                "translate(-50%, -50%) scale(1) rotate(" + baseRotation + "deg)";
            });
          });
        });
      });
    }


    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }
  });
</script>
