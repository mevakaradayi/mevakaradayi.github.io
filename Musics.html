<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Music — mevakaradayi</title>
    <link href="/mywebsite.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body class="intro-page musics-page">
    <a class="films-exit" href="Media.html" aria-label="Exit to Media"><img src="Images/exit.png" alt="" width="96" height="96"></a>

    <main class="musics-main">
      <div class="musics-stage">
        <div class="musics-radio">
          <img src="musics_images/radio.png" width="640" height="640" alt="Radio">
        </div>
        <section class="musics-playlist" aria-label="Spotify playlist">
          <iframe
            class="musics-playlist__embed"
            title="Spotify playlist"
            src="https://open.spotify.com/playlist/6byDbXotMCOLoceqrrZDMw?si=4vjDdGHVSZOxJ7LVCFU-Hw"
            width="100%"
            height="480"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
          ></iframe>
        </section>
      </div>
    </main>
  </body>
</html>
