<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Books — mevakaradayi</title>
    <link href="/mywebsite.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body class="intro-page books-page">
    <a class="films-exit" href="Media.html" aria-label="Exit to Media"><img src="Images/exit.png" alt="" width="96" height="96"></a>

    <img class="books-year" src="books_images/year.png" alt="" aria-hidden="true">

    <main class="books-main">
      <div class="books-main__stage">
        <div
          class="books-rail"
          id="books-rail"
          tabindex="0"
          role="region"
          aria-label="Book covers"
        >
          <div class="books-rail__track" id="books-track">
            <div class="books-card" data-title="The Grapes of Wrath">
                <div class="books-card__inner">
                <img
                  src="books_images/STEINBECK CENTENNIAL EDITION.jpg"
                  width="400"
                  height="600"
                  alt="The Grapes of Wrath cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="84 Charing Cross Road">
              <div class="books-card__inner">
                <img
                  src="books_images/84_charing_cross_road.jpg"
                  width="400"
                  height="600"
                  alt="84 Charing Cross Road cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="The White Album">
              <div class="books-card__inner">
                <img
                  src="books_images/the_white_album_book_cover.jpg"
                  width="400"
                  height="600"
                  alt="The White Album cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="My Brilliant Friend">
              <div class="books-card__inner">
                <img
                  src="books_images/my_brilliant_friend_book_cover.jpg"
                  width="400"
                  height="600"
                  alt="My Brilliant Friend cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="Peace">
              <div class="books-card__inner">
                <img
                  src="books_images/peace_book_cover.jpg"
                  width="400"
                  height="600"
                  alt="Peace cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="My Name Is Red">
              <div class="books-card__inner">
                <img
                  src="books_images/benim_adim_kirmizi.jpg"
                  width="400"
                  height="600"
                  alt="My Name Is Red cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="My Year">
              <div class="books-card__inner">
                <img
                  src="books_images/my_year_book_cover.jpg"
                  width="400"
                  height="600"
                  alt="My Year cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="The Great World">
              <div class="books-card__inner">
                <img
                  src="books_images/great_world_book_cover.jpg"
                  width="400"
                  height="600"
                  alt="The Great World cover"
                  draggable="false"
                >
              </div>
            </div>
            <div class="books-card" data-title="The Lord of the Rings">
              <div class="books-card__inner">
                <img
                  src="books_images/LOTR_book_cover.jpeg"
                  width="400"
                  height="600"
                  alt="LOTR cover"
                  draggable="false"
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var rail = document.getElementById("books-rail");
        var track = document.getElementById("books-track");
        if (!rail || !track) return;

        var cards = Array.prototype.slice.call(track.querySelectorAll(".books-card"));
        if (!cards.length) return;

        var active = 0;
        var scrollScheduled = false;
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function closestToCenter() {
          var rect = rail.getBoundingClientRect();
          var mid = rect.left + rect.width / 2;
          var best = 0;
          var bestDist = Infinity;
          for (var i = 0; i < cards.length; i++) {
            var r = cards[i].getBoundingClientRect();
            var c = r.left + r.width / 2;
            var d = Math.abs(c - mid);
            if (d < bestDist) {
              bestDist = d;
              best = i;
            }
          }
          return best;
        }

        function applyFocus(index) {
          active = index;
          for (var i = 0; i < cards.length; i++) {
            cards[i].classList.toggle("books-card--focus", i === index);
          }
        }

        function updatePerspective() {
          var rect = rail.getBoundingClientRect();
          var mid = rect.left + rect.width / 2;
          var norm = Math.max(rect.width * 0.42, 220);
          for (var i = 0; i < cards.length; i++) {
            var r = cards[i].getBoundingClientRect();
            var cx = r.left + r.width / 2;
            var t = (mid - cx) / norm;
            if (t > 1) t = 1;
            if (t < -1) t = -1;
            var maxDeg = reduceMotion ? 0 : 58;
            var rotY = t * maxDeg;
            var face = 1 - Math.abs(t);
            var scale = 0.78 + face * 0.27;
            var tz = face * 72;
            cards[i].style.transform =
              "translateZ(" + tz + "px) rotateY(" + rotY + "deg) scale(" + scale + ")";
            cards[i].style.zIndex = String(Math.round(10 + face * 90));
          }
        }

        function updateFromScroll() {
          applyFocus(closestToCenter());
          updatePerspective();
          scrollScheduled = false;
        }

        function onScroll() {
          if (!scrollScheduled) {
            scrollScheduled = true;
            requestAnimationFrame(updateFromScroll);
          }
        }

        function go(delta) {
          var next = Math.max(0, Math.min(cards.length - 1, active + delta));
          cards[next].scrollIntoView({
            inline: "center",
            block: "nearest",
            behavior: "smooth"
          });
          applyFocus(next);
        }

        rail.addEventListener("scroll", onScroll, { passive: true });

        document.addEventListener("keydown", function (e) {
          if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          var ae = document.activeElement;
          if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable)) return;
          if (ae && ae.closest && ae.closest(".films-exit")) return;
          e.preventDefault();
          go(e.key === "ArrowRight" ? 1 : -1);
        });

        window.addEventListener("resize", onScroll);

        cards.forEach(function (card) {
          card.addEventListener("click", function () {
            var idx = cards.indexOf(card);
            if (idx === -1) return;
            card.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
            applyFocus(idx);
          });
        });

        requestAnimationFrame(function () {
          cards[0].scrollIntoView({ inline: "center", block: "nearest", behavior: "auto" });
          onScroll();
        });
      })();
    </script>
  </body>
</html>
